version: 2
updates:
  # Gradle plugins and libraries, including gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    # Major upgrades (e.g. AGP 8 → 9) need migration work, so they're done by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # "build(deps): bump …" passes the PR title check and doesn't trigger a release.
    commit-message:
      prefix: build
      include: scope
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]

  # Versions of the actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    # Majors aren't ignored here: workflows pin actions by major (@v4), so a major bump is the only update they get.
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
